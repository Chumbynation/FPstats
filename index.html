<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPstats</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <button class="event-button blue" id="ballWon" onclick="selectEvent('Ball Won')">Ball Won</button>
      <button class="event-button red" id="ballLost" onclick="selectEvent('Ball Lost')">Ball Lost</button>
      <button class="event-button yellow" id="chance" onclick="selectEvent('Chance')">Chance</button>
      <button class="event-button green" id="goal" onclick="selectEvent('Goal')">Goal</button>
      <div id="filters">
        <h3>Filter Options</h3>
        <label><input type="checkbox" class="filter-checkbox" value="Ball Won" checked> Ball Won</label>
        <label><input type="checkbox" class="filter-checkbox" value="Ball Lost" checked> Ball Lost</label>
        <label><input type="checkbox" class="filter-checkbox" value="Chance" checked> Chance</label>
        <label><input type="checkbox" class="filter-checkbox" value="Goal" checked> Goal</label>
      </div>
      <div id="timerControls">
        <h3>Timer Controls</h3>
        <button class="timer-button" onclick="startTimer()">Start/Pause Timer</button>
        <button class="timer-button" onclick="switchHalf()">Switch Half</button>
        <p>Elapsed Time: <span id="elapsedTime">00:00</span></p>
        <p>Current Half: <span id="currentHalf">1st Half</span></p>
      </div>
      <div id="eventControls">
        <h3>Event Controls</h3>
        <button class="event-control-button" onclick="clearEvents()">Clear Events</button>
        <button class="event-control-button" onclick="undoEvent()">Undo</button>
      </div>
      <div id="rawDataLink">
        <h3>Raw Data</h3>
        <a href="raw_data.html">View Raw Data</a>
      </div>
    </div>
    <div id="pitchArea">
      <div id="pitch" onclick="addEvent(event)">
        <img src="football_pitch.jpeg" alt="Football Pitch" id="pitchImage">
        <div class="pitch-label" id="D3">D3</div>
        <div class="pitch-label" id="M3">M3</div>
        <div class="pitch-label" id="F3">F3</div>
      </div>
    </div>
  </div>
  <table id="dataTable"></table>
  <script src="scripts.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then((registration) => {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch((error) => {
          console.log('Service Worker registration failed:', error);
        });
    }
  </script>
</body>
</html>
